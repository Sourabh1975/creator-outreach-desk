<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Creator Desk Assistant</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #faf8f7;
      color: #20191d;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #70264f;
      color: #fff;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 15px;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 700;
    }
    small {
      color: #766c72;
      font-size: 11px;
    }
    .toggle-card {
      background: #fff;
      border: 1px solid #e7dfdc;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .toggle-card span {
      font-size: 12px;
      font-weight: 600;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #70264f; }
    input:checked + .slider:before { transform: translateX(16px); }

    .scraper-card {
      background: #ffffff;
      border: 1px solid #e7dfdc;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 12px;
    }
    .scraper-title {
      font-size: 12px;
      font-weight: 700;
      color: #70264f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .badge-count {
      background: #70264f;
      color: #fff;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 800;
    }
    .scraper-desc {
      font-size: 11px;
      color: #766c72;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .btn-action {
      width: 100%;
      background: #70264f;
      color: #fff;
      border: 0;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
      transition: background 0.2s;
    }
    .btn-action:hover { background: #561d3c; }
    .btn-link {
      width: 100%;
      background: #f4ecef;
      color: #70264f;
      border: 1px solid #e0d0d8;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      box-sizing: border-box;
    }
    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #28634b;
      background: #e2f4ed;
      padding: 3px 7px;
      border-radius: 6px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">C</div>
    <div>
      <h1>Creator Desk</h1>
      <small>Outreach & Instagram Scraper</small>
    </div>
  </div>

  <div class="toggle-card">
    <span>💬 WhatsApp Auto-Send</span>
    <label class="switch">
      <input type="checkbox" id="autoSendToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-card">
    <span>✉️ Gmail Auto-Send</span>
    <label class="switch">
      <input type="checkbox" id="autoSendEmailToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="scraper-card">
    <div class="scraper-title">
      <span>📸 Instagram UGC Scraper</span>
      <span class="badge-count" id="igCountBadge">0</span>
    </div>
    <div class="scraper-desc">
      Collects &lt;3k followers creators with emails/WhatsApp from Instagram profiles.
    </div>
    <button class="btn-action" id="exportIgCsvBtn">📥 Download Excel / CSV</button>
    <a href="https://www.instagram.com/explore/tags/ugccreatorindia/" target="_blank" class="btn-link">🔗 Open #ugccreatorindia</a>
  </div>

  <div><span class="status-badge" id="statusBadge">Active & Ready</span></div>

  <script src="popup.js"></script>
</body>
</html>
